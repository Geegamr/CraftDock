[package]
name = "craftdock-servers-dat"
version = "0.1.0"
edition = "2024"

[dependencies]
flate2 = "1.1"
serde_json = { version = "1.0", features = ["preserve_order"] }

[[bin]]
name = "craftdock-server-jar-list"
path = "src/bin/craftdock-server-jar-list.rs"

[[bin]]
name = "craftdock-screenshot-list"
path = "src/bin/craftdock-screenshot-list.rs"

[[bin]]
name = "craftdock-config-file-list"
path = "src/bin/craftdock-config-file-list.rs"

[[bin]]
name = "craftdock-server-properties"
path = "src/bin/craftdock-server-properties.rs"

[[bin]]
name = "craftdock-instance-world-list"
path = "src/bin/craftdock-instance-world-list.rs"

[[bin]]
name = "craftdock-server-json"
path = "src/bin/craftdock-server-json.rs"

[[bin]]
name = "craftdock-modpack-metadata"
path = "src/bin/craftdock-modpack-metadata.rs"

[[bin]]
name = "craftdock-instance-mod-toggle"
path = "src/bin/craftdock-instance-mod-toggle.rs"

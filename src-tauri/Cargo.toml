[package]
name = "craftdock"
version = "0.7.0"
description = "CraftDock Tauri migration slice"
authors = ["CraftDock Team"]
edition = "2024"
build = "build.rs"

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
aes-gcm = "0.10"
base64 = "0.22"
hex = "0.4"
rand = "0.8"

[build-dependencies]
tauri-build = { version = "2", features = [] }
